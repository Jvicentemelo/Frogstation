name: Build e release (Windows)

# - push na main e pull requests: compila e guarda o .zip como "artifact" (para testar).
# - tag "v*" (ex.: v0.1.0): compila e publica o .zip em um Release do GitHub.
# - "Run workflow" na aba Actions: compila manualmente.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar o Release

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Definir a versão
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME }
          else { $v = 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Configurar (CMake baixa o SDL2 sozinho)
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Gerar o pacote portátil
        shell: pwsh
        run: ./tools/package.ps1 -QtDir "$env:QT_ROOT_DIR" -Version "${{ steps.ver.outputs.version }}"

      - name: Guardar o .zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Frogstation-win64
          path: dist/*.zip
          retention-days: 14

      - name: Publicar no Release (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
